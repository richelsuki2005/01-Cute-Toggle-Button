<html>
<head>
	<title>Cute Toggle Button</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
		<div class="toggle-container" id="toggleContainer">
	<div class="toggle-button" id="toggleBtn">
		<div class="face icon-off">
		<svg viewBox="0 0 100 100" width="100%" height="100%">
			
			<path d="M 22 44 Q 32 54 42 44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    		<path d="M 58 44 Q 68 54 78 44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>

			<path d="M 45 62 Q 50 67 55 62" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round"/>


			<circle cx="17" cy="53" r="6" fill="#ff6b81" opacity="0.8"/>
    		<circle cx="83" cy="53" r="6" fill="#ff6b81" opacity="0.8"/>
		</svg>
	</div>
	<div class="face icon-on">
		<svg viewBox="0 0 100 100" width="100%" height="100%">
			<circle cx="35" cy="45" r="7" fill="#d63031"/>
			<circle cx="65" cy="45" r="7" fill="#d63031"/>
			<circle cx="37" cy="43" r="2.5" fill="#ffffff"/>
			<circle cx="67" cy="43" r="2.5" fill="#ffffff"/>
			<path d="M 38 60 Q 50 75 62 60 Z" fill="#d63031"/>
			<circle cx="22" cy="55" r="7" fill="#ff7675" opacity="0.6"/>
			<circle cx="78" cy="55" r="7" fill="#ff7675" opacity="0.6"/>
		</svg>
	</div>
	</div>
	</div>


	<script src="script.js"></script>
</body>
</html>
